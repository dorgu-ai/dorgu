name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Build provenance (actions/attest-build-provenance): signed with the workflow's OIDC
  # identity and stored in GitHub's attestation store.
  id-token: write
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Verify version output
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o dorgu ./cmd/dorgu
          echo "Version output for this release:"
          ./dorgu version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance for every release archive (the binaries are inside them): the digests are the
      # ones GoReleaser wrote to checksums.txt, so `gh attestation verify <archive>` checks the file
      # the install instructions download.
      - name: Attest release archives build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

      # And for the checksums file itself, so the file a person runs `sha256sum -c` against is
      # known to come from this workflow too.
      - name: Attest checksums build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/checksums.txt
