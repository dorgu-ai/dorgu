# GoReleaser config for Dorgu
# Docs: https://goreleaser.com
# Triggered on git tag: git tag -a v0.1.0 -m "Release v0.1.0" && git push --tags

version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: dorgu
    main: ./cmd/dorgu
    binary: dorgu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - id: dorgu
    ids:
      - dorgu
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      dorgu_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - .dorgu.yaml.example

  # Unversioned copies of the archives above so that
  # https://github.com/dorgu-ai/dorgu/releases/latest/download/dorgu_<os>_<arch>.tar.gz
  # is a copy-paste install URL that never needs a version bump.
  - id: dorgu-unversioned
    ids:
      - dorgu
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      dorgu_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - .dorgu.yaml.example

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: dorgu-ai
    name: dorgu
  draft: false
  prerelease: auto
  name_template: "Dorgu {{.Version}}"
  header: |
    ## What's New

    Open-source AI SRE for Kubernetes: detect failures, diagnose them, heal with your approval.
  footer: |
    ## Installation

    With a Go toolchain:

    ```bash
    go install github.com/dorgu-ai/dorgu/cmd/dorgu@{{.Tag}}
    ```

    Without Go, download a binary. Swap `linux`/`amd64` for your platform
    (`linux` or `darwin`; `amd64` or `arm64`):

    ```bash
    curl -fLo dorgu.tar.gz https://github.com/dorgu-ai/dorgu/releases/download/{{.Tag}}/dorgu_{{.Version}}_linux_amd64.tar.gz
    tar -xzf dorgu.tar.gz dorgu
    chmod +x dorgu
    sudo mv dorgu /usr/local/bin/
    dorgu version
    ```

    The unversioned `dorgu_<os>_<arch>.tar.gz` assets below are the same archives
    under a stable URL: `https://github.com/dorgu-ai/dorgu/releases/latest/download/dorgu_linux_amd64.tar.gz`.

